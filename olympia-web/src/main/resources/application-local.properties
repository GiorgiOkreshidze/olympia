# Local Environment Properties
server.port=8080

# Common application properties override or specific to local
app.storage.initialDataPath=initial-data.txt

# Database connection for local environment
database.driver=org.postgresql.Driver
database.url=jdbc:postgresql://localhost:5432/olympia_db
database.username=postgres
database.password=1350

# Hibernate configuration
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.show_sql=true
hibernate.hbm2ddl.auto=update

# Logging configuration
logging.level.dev\.local\.olympia=DEBUG
logging.level.org\.springframework=WARN

# Actuator endpoints (if not defined in common application.properties)
management.endpoints.web.exposure.include=health,info,prometheus